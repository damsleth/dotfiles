# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  🐱 WILD KITTY — deep-ocean blue rice
#  borderless · translucent · blurred · DepartureMono 18
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Font ────────────────────────────────────────────────────
font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0

# ── Borderless & translucent ───────────────────────────────
# titlebar-only (not yes): keeps NSWindowStyleMaskTitled so macOS's
# "Move focus to next window" (opt+tab) cycles these windows reliably —
# borderless windows (yes) are skipped by the system cycler. Still
# looks fully borderless. Needs full kitty restart to change.
hide_window_decorations titlebar-only
background_opacity      0.82
background_blur         32
dynamic_background_opacity yes
window_padding_width    14
window_margin_width     0
draw_minimal_borders    yes
window_border_width     0
inactive_text_alpha     0.7

# ── Blue-tinted deep-ocean palette ──────────────────────────
background           #0a0e1a
foreground           #c8d6f5
selection_background #2d4a7a
selection_foreground #e8f0ff

cursor               #6db3ff
cursor_text_color    #0a0e1a
cursor_shape         beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.6

# cursor trail — CRANKED 🌊⚡ glacier-cyan aurora behind the blue beam
cursor_trail 1
cursor_trail_decay 0.02 0.8
cursor_trail_start_threshold 0
cursor_trail_color #6adfff

url_color            #7fc8ff
url_style            curly

# black
color0  #1a2236
color8  #3d4a6b
# red → coral with blue undertone
color1  #ff6b8a
color9  #ff8fa8
# green → seafoam
color2  #5ce0b8
color10 #7df0cc
# yellow → sandy gold
color3  #f0d080
color11 #ffe0a0
# blue → electric
color4  #5a9bff
color12 #82b5ff
# magenta → ultraviolet
color5  #b88aff
color13 #cfa8ff
# cyan → glacier
color6  #6adfff
color14 #92ebff
# white → moonlight
color7  #c8d6f5
color15 #eef4ff

# ── Tab bar — powerline waves ───────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_margin_width    8
tab_bar_margin_height   6 0
active_tab_background   #5a9bff
active_tab_foreground   #0a0e1a
active_tab_font_style   bold
inactive_tab_background #16203a
inactive_tab_foreground #6b80b0
tab_title_template      " {index} ▸ {title} "

# ── Layout & splits ─────────────────────────────────────────
enabled_layouts splits,stack,tall
active_border_color   #5a9bff
inactive_border_color #1a2440

# ── Behaviour ───────────────────────────────────────────────
scrollback_lines        10000
mouse_hide_wait         2.0
copy_on_select          yes
strip_trailing_spaces   smart
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    no
confirm_os_window_close 0
# Option must stay the macOS compose key on Norwegian layout: tilde is the
# opt+¨ dead key, and [ ] { } | \ all live behind opt+7/8/9. With this set
# to yes, kitty eats option and none of those compose. kitty's own
# map alt+... binds below are unaffected (kitty always treats opt as alt
# for its own shortcut matching).
macos_option_as_alt     no
macos_quit_when_last_window_closed yes

# ── Keybinds — quick rice controls ─────────────────────────
# opacity on the fly
map cmd+shift+up    set_background_opacity +0.05
map cmd+shift+down  set_background_opacity -0.05
map cmd+shift+0     set_background_opacity 0.82
# splits
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+alt+left    neighboring_window left
map cmd+alt+right   neighboring_window right
map cmd+alt+up      neighboring_window up
map cmd+alt+down    neighboring_window down
# zoom a split (stack toggle)
map cmd+shift+z     toggle_layout stack
# font size
map cmd+plus        change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           change_font_size all 0

# ── Window / tab navigation ────────────────────────────────
# cmd+W closes only the focused split, never the whole tab
map cmd+w           close_window
# option+tab window cycling is handled by macOS itself (system shortcut
# "Move focus to next window") — works now that windows keep the titled
# style mask via hide_window_decorations titlebar-only. No map needed;
# kitty deliberately ignores keys matching enabled global shortcuts.
# macOS-native text editing on the shell input line
# cmd+arrow → start/end of line (ctrl+a / ctrl+e)
map cmd+left        send_text all \x01
map cmd+right       send_text all \x05
# opt+arrow → back/forward one word (alt+b / alt+f)
map alt+left        send_text all \x1bb
map alt+right       send_text all \x1bf
# cmd+backspace → delete to start of line (ctrl+u)
map cmd+backspace   send_text all \x15
# opt+backspace → delete previous word (ctrl+w)
map alt+backspace   send_text all \x17
# cmd+number jumps to that tab
map cmd+1           goto_tab 1
map cmd+2           goto_tab 2
map cmd+3           goto_tab 3
map cmd+4           goto_tab 4
map cmd+5           goto_tab 5
map cmd+6           goto_tab 6
map cmd+7           goto_tab 7
map cmd+8           goto_tab 8
map cmd+9           goto_tab 9
# cmd+shift+r → rename the current tab (interactive prompt)
map cmd+shift+r     set_tab_title

# ── Hints — keyboard-grab anything on screen ───────────────
# overlay letters on targets; press one to act. mouse optional.
map cmd+shift+e     open_url_with_hints
map cmd+shift+p     kitten hints --type path --program -
map cmd+shift+c     kitten hints --type path --program @
map cmd+shift+h     kitten hints --type hash --program @
map cmd+shift+l     kitten hints --type line --program @
map cmd+shift+n     kitten hints --type linenum

# >>> kitty-installer:theme-picker (managed: do not edit between markers) >>>
# Theme picker (fzf TUI w/ live preview, writes light/dark .auto.conf overlays)
map cmd+shift+t launch --type=overlay ~/.config/kitty/kitty-pick-theme/kitty-pick-theme
# <<< kitty-installer:theme-picker <<<
