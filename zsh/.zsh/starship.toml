add_newline = false
command_timeout = 1200

format = "$directory$git_branch$git_state$git_metrics$git_status$cmd_duration$line_break$character"

[directory]
style = "bold cyan"
truncate_to_repo = false
truncation_length = 8
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1

[directory.substitutions]
"~/code/hugr" = "ᚼᚢᚴᛦ"
"~/brain/dump" = "🪣"
"~/brain/vault" = "📝"
"~/brain" = "🧠"
"~/code" = "<⨟>"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_state]
style = "bold red"
format = "([$state( $progress_current/$progress_total)]($style) )"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[git_status]
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?${count}"
stashed = "${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 500
format = "[󱎫 $duration]($style) "
style = "dimmed white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
